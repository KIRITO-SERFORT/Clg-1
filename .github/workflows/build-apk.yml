name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android Project
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v4.3.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Modern Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper

    - name: Auto-Install New Android SDK & Build
      run: |
        rm -rf "public" || true
        rm -rf "docs" || true
        
        # This force-accepts licenses and tells the compiler to auto-download missing SDK elements
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true
        
        # Build command with auto-download enabled
        gradle :app:assembleDebug --stacktrace --info -Pandroid.builder.sdkDownload=true
