name = "clg1-datavis-transfer"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "TRANSFERS"
bucket_name = "clg1-datavis-transfers"

[[d1_databases]]
binding = "DB"
database_name = "clg1-datavis-transfers"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["*/10 * * * *"]
